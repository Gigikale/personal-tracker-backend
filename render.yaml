services:
  - type: web
    name: personal-tracker-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Connection string for a dedicated logical database (e.g. `personal_tracker`)
      # created on the same Postgres instance used by Personal Task Tracker.
      # Set manually in the Render Dashboard after creating that database via psql.
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: "30"
      - key: CORS_ORIGIN
        sync: false
